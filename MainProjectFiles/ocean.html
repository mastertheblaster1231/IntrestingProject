<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Ocean & Sun Waves - Three.js</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #020713;
        font-family: 'Outfit', sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* Floating navigation */
      .nav-bar {
        position: absolute;
        top: 20px;
        right: 24px;
        z-index: 100;
        display: flex;
        gap: 12px;
      }
      .nav-btn {
        background: rgba(6, 18, 38, 0.75);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 224, 66, 0.35);
        color: #fff4bd;
        padding: 10px 18px;
        border-radius: 12px;
        text-decoration: none;
        font-size: 0.88rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s ease;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .nav-btn:hover {
        background: rgba(255, 224, 66, 0.2);
        border-color: #ffe042;
        transform: translateY(-2px);
      }
      .header-pill {
        position: absolute;
        top: 20px;
        left: 24px;
        z-index: 10;
        background: rgba(6, 18, 38, 0.75);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 224, 66, 0.25);
        border-radius: 14px;
        padding: 12px 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .header-title {
        font-size: 1.05rem;
        font-weight: 700;
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .header-sub {
        font-size: 0.78rem;
        color: #ffe6a3;
        margin-top: 2px;
      }
      .info-pill {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(6, 18, 38, 0.65);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        padding: 8px 20px;
        color: #f7eed2;
        font-size: 0.78rem;
        display: flex;
        gap: 14px;
        pointer-events: none;
      }
      .info-pill span strong {
        color: #ffe042;
      }
    </style>
  </head>
  <body>
    <div class="header-pill">
      <div class="header-title">☀️ Ocean Waves & Golden Sun</div>
      <div class="header-sub">Custom GLSL Shader Waves • 60% Sky & Clouds / 40% Ocean</div>
    </div>

    <div class="nav-bar">
      <a href="/index.html" class="nav-btn">🌍 3D World Globe</a>
    </div>

    <div class="info-pill">
      <span>🖱️ <strong>Left Click + Drag:</strong> Pan Horizon</span>
      <span>🔍 <strong>Scroll:</strong> Zoom</span>
      <span>🌊 <strong>Custom Shaders:</strong> Dynamic Swells & Specular Shimmer</span>
    </div>

    <script type="module" src="/3d pages/Ocean.js"></script>
  </body>
</html>
